<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNS Monitor</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600;700&family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Serif+Display&display=swap" rel="stylesheet">
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
  const cfg = {
    apiKey:"AIzaSyAapVOivPIe2QgNyYb6ofdhI4tCv4GyLM4",
    authDomain:"sns-analyze-adf31.firebaseapp.com",
    projectId:"sns-analyze-adf31",
    storageBucket:"sns-analyze-adf31.firebasestorage.app",
    messagingSenderId:"813277294010",
    appId:"1:813277294010:web:23df017c9211a6eba00183"
  };
  const app = initializeApp(cfg);
  const db = getFirestore(app);
  window._db = db;
  window._fs = { collection, doc, setDoc, deleteDoc, onSnapshot, query, orderBy };
  window.dispatchEvent(new Event('fb-ready'));
</script>
<style>
:root{
  --w:#fff;--off:#f8f7f5;--g50:#f9fafb;--g100:#f3f4f6;--g200:#e5e7eb;--g300:#d1d5db;
  --g400:#9ca3af;--g500:#6b7280;--g700:#374151;--g900:#111827;
  --ig:#e1306c;--ig-l:#fff0f4;--ig-m:#fce7ef;
  --xp:#0f0f0f;--xl:#f5f5f5;--xm:#e8e8e8;
  --r:16px;--rs:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans JP',sans-serif;background:var(--off);color:var(--g900);min-height:100vh;font-size:14px;}
.app{display:flex;min-height:100vh;}
.sidebar{width:240px;flex-shrink:0;background:var(--w);border-right:1px solid var(--g200);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;z-index:50;}
.logo-wrap{padding:22px 20px 18px;border-bottom:1px solid var(--g100);}
.logo{font-family:'DM Serif Display',serif;font-size:20px;color:var(--g900);}
.logo em{color:var(--ig);font-style:normal;}
.logo-sub{font-size:10px;color:var(--g400);letter-spacing:1.5px;text-transform:uppercase;margin-top:2px;}
.sync-bar{display:flex;align-items:center;gap:6px;padding:8px 20px;border-bottom:1px solid var(--g100);font-size:10px;color:var(--g400);}
.sdot{width:6px;height:6px;border-radius:50%;background:var(--g300);flex-shrink:0;}
.sdot.on{background:#10b981;}.sdot.syn{background:#f59e0b;animation:p .8s infinite;}
@keyframes p{0%,100%{opacity:1}50%{opacity:.3}}
.snav{padding:14px 12px;flex:1;}
.nlbl{font-size:10px;color:var(--g400);letter-spacing:1.5px;text-transform:uppercase;padding:0 8px;margin:14px 0 6px;}
.nlbl:first-child{margin-top:0;}
.ni{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;cursor:pointer;transition:all .15s;font-size:13px;font-weight:500;color:var(--g500);border:none;background:none;width:100%;text-align:left;}
.ni:hover{background:var(--g50);color:var(--g900);}
.ni.act{background:var(--ig-l);color:var(--ig);font-weight:600;}
.ni.act .nicon{background:var(--ig);color:white;}
.nicon{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--g100);transition:all .15s;flex-shrink:0;}
.main{flex:1;display:flex;flex-direction:column;min-width:0;}
.topbar{background:var(--w);border-bottom:1px solid var(--g200);padding:0 28px;height:58px;display:flex;align-items:center;gap:14px;position:sticky;top:0;z-index:40;}
.tbtitle{font-family:'DM Serif Display',serif;font-size:18px;flex:1;}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 16px;border-radius:8px;border:none;cursor:pointer;font-size:13px;font-weight:500;font-family:'Noto Sans JP',sans-serif;transition:all .15s;}
.bp{background:var(--ig);color:white;}.bp:hover{background:#c9184a;}
.btn:disabled{opacity:.5;cursor:not-allowed;}
.page{display:none;flex:1;overflow-y:auto;}
.page.act{display:flex;flex-direction:column;}
.pi{padding:24px 28px;flex:1;}
.addbar{background:white;border:1.5px dashed var(--g200);border-radius:var(--r);padding:14px 18px;display:flex;align-items:center;gap:12px;margin-bottom:20px;cursor:pointer;transition:all .2s;}
.addbar:hover{border-color:var(--ig);background:var(--ig-l);}
.addbar-icon{width:38px;height:38px;border-radius:10px;background:var(--g100);display:flex;align-items:center;justify-content:center;font-size:17px;flex-shrink:0;}
.fbar{display:flex;align-items:center;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
.fc{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:500;border:1.5px solid var(--g200);background:white;cursor:pointer;transition:all .15s;color:var(--g600);}
.fc:hover{border-color:var(--g400);}
.fc.act{background:var(--ig);border-color:var(--ig);color:white;}
.ssel{margin-left:auto;background:white;border:1.5px solid var(--g200);padding:5px 10px;border-radius:8px;font-size:12px;color:var(--g700);outline:none;cursor:pointer;font-family:'Noto Sans JP',sans-serif;}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px;}
.pcard{background:white;border-radius:var(--r);overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.06);transition:all .2s;cursor:pointer;border:1.5px solid transparent;}
.pcard:hover{box-shadow:0 10px 36px rgba(0,0,0,.11);transform:translateY(-2px);border-color:var(--g200);}
.pcard.igc{border-top:3px solid var(--ig);}
.pcard.xc{border-top:3px solid var(--xp);}
.pthumb{position:relative;width:100%;padding-top:100%;background:var(--g100);overflow:hidden;}
.pthumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .3s;}
.pcard:hover .pthumb img{transform:scale(1.04);}
.pph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:var(--g400);}
.pph .pi2{font-size:30px;opacity:.4;}
.pph .pt{font-size:11px;}
.tsnsbadge{position:absolute;top:8px;left:8px;padding:3px 7px;border-radius:6px;font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;}
.big{background:var(--ig);color:white;}
.bx{background:var(--xp);color:white;}
.hotfl{position:absolute;top:8px;right:8px;background:#ff4500;color:white;font-size:9px;font-weight:700;padding:2px 6px;border-radius:6px;}
.delf{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;color:white;font-size:11px;font-weight:600;backdrop-filter:blur(2px);}
.cbody{padding:11px 13px 13px;}
.cacc{display:flex;align-items:center;gap:6px;margin-bottom:7px;}
.cav{width:20px;height:20px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;flex-shrink:0;}
.can{font-size:11px;font-weight:600;color:var(--g700);}
.cdt{margin-left:auto;font-size:10px;color:var(--g400);}
.ccap{font-size:12px;line-height:1.5;color:var(--g600);margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.cgenre{display:inline-block;font-size:10px;font-weight:600;padding:2px 7px;border-radius:20px;margin-bottom:8px;}
.cstats{display:grid;grid-template-columns:1fr 1fr;gap:5px;}
.cstat{background:var(--g50);border-radius:7px;padding:5px 7px;display:flex;align-items:center;gap:5px;}
.csv{font-family:'DM Sans',sans-serif;font-weight:700;font-size:12px;line-height:1;}
.csl{font-size:9px;color:var(--g400);margin-top:1px;}
.engrow{margin-top:7px;display:flex;align-items:center;gap:6px;}
.engl{font-size:10px;color:var(--g500);}
.engv{font-family:'DM Sans',sans-serif;font-weight:700;font-size:12px;}
.engbw{flex:1;height:3px;background:var(--g100);border-radius:2px;overflow:hidden;}
.engbf{height:100%;border-radius:2px;transition:width .6s;}
.movl{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(6px);z-index:200;display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s;}
.movl.open{opacity:1;pointer-events:all;}
.modal{background:white;width:100%;max-width:540px;border-radius:20px 20px 0 0;max-height:90vh;overflow-y:auto;transform:translateY(40px);transition:transform .25s;}
.movl.open .modal{transform:translateY(0);}
@media(min-width:640px){.movl{align-items:center;}.modal{border-radius:20px;max-height:85vh;}}
.mhandle{width:34px;height:4px;background:var(--g200);border-radius:2px;margin:11px auto 0;}
.mhead{padding:14px 18px;border-bottom:1px solid var(--g100);display:flex;align-items:center;justify-content:space-between;}
.mtitle{font-weight:700;font-size:15px;}
.mbody{padding:18px;}
.fg{margin-bottom:14px;}
.fl{font-size:11px;font-weight:600;color:var(--g600);margin-bottom:5px;display:block;text-transform:uppercase;letter-spacing:.5px;}
.fi{width:100%;background:var(--g50);border:1.5px solid var(--g200);color:var(--g900);padding:9px 13px;border-radius:10px;font-size:14px;outline:none;font-family:'Noto Sans JP',sans-serif;transition:border-color .15s;}
.fi:focus{border-color:var(--ig);background:white;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.hint{font-size:11px;color:var(--g400);margin-top:3px;}
.toast{position:fixed;bottom:76px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--g900);color:white;padding:9px 18px;border-radius:10px;font-size:13px;z-index:300;opacity:0;transition:all .25s;pointer-events:none;white-space:nowrap;}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
.mobile-tabs{display:none;}
@media(max-width:767px){
  .sidebar{display:none;}
  .mobile-tabs{display:flex;position:fixed;bottom:0;left:0;right:0;background:white;border-top:1px solid var(--g200);z-index:100;padding-bottom:env(safe-area-inset-bottom);}
  .tabi{flex:1;display:flex;flex-direction:column;align-items:center;padding:9px 4px;cursor:pointer;transition:all .15s;border:none;background:none;color:var(--g400);}
  .tabi.act{color:var(--ig);}
  .tabicon{font-size:19px;line-height:1;}
  .tablbl{font-size:9px;font-weight:600;margin-top:2px;letter-spacing:.3px;}
  .pi{padding:14px;padding-bottom:76px;}
  .pgrid{grid-template-columns:repeat(2,1fr);gap:10px;}
}
.spin2{width:13px;height:13px;border:2px solid rgba(255,255,255,.3);border-top-color:white;border-radius:50%;animation:sp .6s linear infinite;display:inline-block;}
@keyframes sp{to{transform:rotate(360deg)}}
.tdots span{display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--ig);margin:0 2px;animation:td 1.2s infinite;}
.tdots span:nth-child(2){animation-delay:.2s;}.tdots span:nth-child(3){animation-delay:.4s;}
@keyframes td{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
::-webkit-scrollbar{width:4px;height:4px;}::-webkit-scrollbar-track{background:transparent;}::-webkit-scrollbar-thumb{background:var(--g200);border-radius:2px;}
</style>
</head>
<body>
<div class="app">
<nav class="sidebar">
  <div class="logo-wrap"><div class="logo">SNS<em>Monitor</em></div><div class="logo-sub">競合分析ツール</div></div>
  <div class="sync-bar"><div class="sdot" id="sdot"></div><span id="slbl">接続中...</span></div>
  <div class="snav">
    <div class="nlbl">メニュー</div>
    <button class="ni act" onclick="go('dashboard',this)"><span class="nicon">📊</span>ダッシュボード</button>
    <button class="ni" onclick="go('feed',this)"><span class="nicon">🗂</span>投稿一覧</button>
  </div>
</nav>
<div class="main">
  <div class="topbar">
    <div class="tbtitle" id="tbtitle">ダッシュボード</div>
    <button class="btn bp" onclick="openPostModal()">＋ 投稿追加</button>
  </div>
  <!-- DASHBOARD -->
  <div class="page act" id="page-dashboard"><div class="pi">
    <div class="addbar" onclick="openGoogleSheets()" style="background:#ecfdf5;border-color:#86efac">
      <div class="addbar-icon">📊</div>
      <div style="flex:1"><div style="font-weight:600;font-size:14px;color:var(--g700)">Google Sheetsから読み込み</div><div style="font-size:12px;color:var(--g400);margin-top:2px">登録したスプレッドシートからURLを自動取得・分析</div></div>
      <button class="btn bp">読み込む</button>
    </div>
    <div class="addbar" onclick="openFileUpload()">
      <div class="addbar-icon">📎</div>
      <div style="flex:1"><div style="font-weight:600;font-size:14px;color:var(--g700)">URLファイルをアップロード</div><div style="font-size:12px;color:var(--g400);margin-top:2px">テキストファイルから複数URLを一括読み込み</div></div>
      <button class="btn bp">アップロード</button>
    </div>
  </div></div>
  <!-- FEED -->
  <div class="page" id="page-feed"><div class="pi">
    <div class="fbar">
      <div class="fc act" onclick="fsns('all',this)">すべて</div>
      <div class="fc" onclick="fsns('ig',this)" style="border-color:#f9a8c4;color:var(--ig)">📸 Instagram</div>
      <div class="fc" onclick="fsns('x',this)" style="border-color:#c0c0c0;color:var(--xp)">𝕏 X</div>
      <select class="ssel" onchange="fsort(this.value)">
        <option value="date">新着順</option><option value="likes">いいね順</option><option value="eng">ENG率順</option>
      </select>
    </div>
    <div id="fposts"></div>
  </div></div>
</div>
</div>
<!-- MOBILE TABS -->
<div class="mobile-tabs">
  <button class="tabi act" onclick="go('dashboard',this)" data-page="dashboard"><div class="tabicon">📊</div><div class="tablbl">ホーム</div></button>
  <button class="tabi" onclick="go('feed',this)" data-page="feed"><div class="tabicon">🗂</div><div class="tablbl">一覧</div></button>
  <button class="tabi" onclick="openPostModal()" data-page=""><div class="tabicon" style="background:var(--ig);color:white;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;margin-top:-14px;box-shadow:0 4px 12px rgba(225,48,108,.4)">+</div><div class="tablbl">追加</div></button>
</div>
<!-- ADD POST MODAL -->
<div class="movl" id="mpost">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mhead"><div class="mtitle">投稿を追加・AI分析</div><button onclick="cm('mpost')" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--g400)">×</button></div>
    <div class="mbody">
      <div class="fg"><label class="fl">SNS</label><div style="display:grid;grid-template-columns:1fr 1fr;gap:8px"><button onclick="pSNS('ig')" id="psig" style="padding:9px;border-radius:10px;border:1.5px solid var(--g200);background:var(--ig-l);border-color:var(--ig);color:var(--ig);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500">📸 Instagram</button><button onclick="pSNS('x')" id="psix" style="padding:9px;border-radius:10px;border:1.5px solid var(--g200);background:white;color:var(--g700);cursor:pointer;font-family:inherit;font-size:13px;font-weight:500">𝕏 X</button></div></div>
      <div class="fg"><label class="fl">アカウント</label><select class="fi" id="pacc"></select></div>
      <div class="fg"><label class="fl">投稿URL / キャプション</label><input class="fi" id="purl" placeholder="https://... またはキャプション" /><div class="hint">URLまたはキャプション</div></div>
      <div class="fg"><label class="fl">投稿日</label><input class="fi" id="pdate" type="date" /></div>
      <div class="fr">
        <div class="fg"><label class="fl">❤️ いいね数</label><input class="fi" id="plikes" type="number" min="0" placeholder="0" /></div>
        <div class="fg"><label class="fl">💬 コメント数</label><input class="fi" id="pcomments" type="number" min="0" placeholder="0" /></div>
      </div>
      <div class="fr">
        <div class="fg"><label class="fl">🔖 保存数</label><input class="fi" id="psaves" type="number" min="0" placeholder="0" /></div>
        <div class="fg"><label class="fl">👥 フォロワー数</label><input class="fi" id="pfollowers" type="number" min="0" placeholder="0" /></div>
      </div>
      <button class="btn bp" style="width:100%;justify-content:center;padding:11px" id="bsubp" onclick="subPost()">✦ AI分析して保存</button>
    </div>
  </div>
</div>
<!-- GOOGLE SHEETS MODAL -->
<div class="movl" id="mgsheets">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mhead"><div class="mtitle">Google Sheetsから読み込み</div><button onclick="cm('mgsheets')" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--g400)">×</button></div>
    <div class="mbody">
      <div class="fg"><label class="fl">スプレッドシートID</label><input class="fi" id="sheetid" placeholder="13Lewqy-CBvkPkLDVE1Y1zLAM_5acF2oRtH3XCPewsxc" /></div>
      <div class="fg"><label class="fl">Google Sheets API キー</label><input class="fi" id="apikey" placeholder="AIzaSyC94Z0YFefUVkCdTD6b3xHPppi6XrLAosU" /></div>
      <div class="fg"><label class="fl">アカウント</label><select class="fi" id="gascc"></select></div>
      <button class="btn bp" style="width:100%;justify-content:center;padding:11px" id="blogsh" onclick="loadGoogleSheets()">🔄 読み込み開始</button>
    </div>
  </div>
</div>
<!-- FILE UPLOAD MODAL -->
<div class="movl" id="mfile">
  <div class="modal">
    <div class="mhandle"></div>
    <div class="mhead"><div class="mtitle">URLファイルをアップロード</div><button onclick="cm('mfile')" style="background:none;border:none;font-size:20px;cursor:pointer;color:var(--g400)">×</button></div>
    <div class="mbody">
      <div class="fg"><label class="fl">テキストファイル選択</label><input type="file" id="furl" accept=".txt,.csv" style="width:100%;padding:8px;border:1.5px solid var(--g200);border-radius:10px;cursor:pointer;font-family:inherit" /></div>
      <div class="hint">1行に1つのURLを入力したテキストファイル</div>
      <div class="fg"><label class="fl">アカウント</label><select class="fi" id="fascc"></select></div>
      <button class="btn bp" style="width:100%;justify-content:center;padding:11px" id="blogf" onclick="loadFile()">📁 ファイルを読み込み</button>
    </div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const S={accounts:[],posts:[],fSNS:'all',fSort:'date',page:'dashboard',pSNS:'ig'};
const AC=['#e1306c','#c77dff','#0077b6','#f4a261','#2d6a4f','#e63946','#457b9d'];
const GN={'料理・グルメ':{e:'🍽',c:'#f59e0b',bg:'#fffbeb'},'ライフスタイル':{e:'✨',c:'#10b981',bg:'#f0fdf4'},'商品・PR':{e:'🛍',c:'#06b6d4',bg:'#ecfeff'},'キャンペーン':{e:'🎁',c:'#e1306c',bg:'#fff0f4'},'エンタメ':{e:'🎭',c:'#a855f7',bg:'#faf5ff'},'教育・Tips':{e:'💡',c:'#f97316',bg:'#fff7ed'},'ビジネス':{e:'💼',c:'#64748b',bg:'#f8fafc'},'トレンド':{e:'🔥',c:'#ef4444',bg:'#fef2f2'},'その他':{e:'📌',c:'#9ca3af',bg:'#f9fafb'}};
function ac(n){let h=0;for(let c of n)h+=c.charCodeAt(0);return AC[h%AC.length];}
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);}
function cm(id){document.getElementById(id).classList.remove('open');}
function om(id){document.getElementById(id).classList.add('open');}
document.querySelectorAll('.movl').forEach(el=>el.addEventListener('click',e=>{if(e.target===el)el.classList.remove('open');}));
function ss(st){const d=document.getElementById('sdot'),l=document.getElementById('slbl');if(st==='on'){d.className='sdot on';l.textContent='同期済み';}else if(st==='syn'){d.className='sdot syn';l.textContent='同期中...';}else{d.className='sdot';l.textContent='オフライン';}}
let db,fs;
window.addEventListener('fb-ready',async()=>{
  db=window._db;fs=window._fs;ss('syn');
  try{
    fs.onSnapshot(fs.collection(db,'accounts'),snap=>{S.accounts=snap.docs.map(d=>({id:d.id,...d.data()}));renderAS();});
    fs.onSnapshot(fs.query(fs.collection(db,'posts'),fs.orderBy('createdAt','desc')),snap=>{S.posts=snap.docs.map(d=>({id:d.id,...d.data()}));if(S.page==='feed')renderFeed();ss('on');});
  }catch(e){ss('offline');console.error(e);}
});
async function saveA(a){await fs.setDoc(fs.doc(db,'accounts',a.id),a);}
async function saveP(p){await fs.setDoc(fs.doc(db,'posts',p.id),p);}
function go(id,el){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('act'));
  document.getElementById('page-'+id).classList.add('act');
  document.querySelectorAll('.sidebar .ni').forEach(n=>n.classList.remove('act'));

async function subPost(){
  const url=document.getElementById('purl').value.trim(),aid=document.getElementById('pacc').value;

  const acc=S.accounts.find(a=>a.id===aid);

  const eng=fw>0?parseFloat(((lk+cm2+sv)/fw*100).toFixed(2)):0;

    const r=await fetch("https://api.anthropic.com/v1/messages",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"claude-sonnet-4-20250514",max_tokens:800,messages:[{role:"user",content:pr}]})});

async function loadGoogleSheets(){
  const shid=document.getElementById('sheetid').value.trim(),akey=document.getElementById('apikey').value.trim(),aid=document.getElementById('gascc').value;

  try{
    const url=`https://sheets.googleapis.com/v4/spreadsheets/${shid}/values/A:A?key=${akey}`;
    const r=await fetch(url);const d=await r.json();

    toast(`${urls.length}個のURLを検出しました`);

      await new Promise(resolve=>setTimeout(resolve,500));

      const pr=`SNSマーケターとして分析しJSONのみ回答。
URL:${u} いいね:${lk} ENG率:${eng}%
{"genre":"料理・グルメ/ライフスタイル/商品・PR/キャンペーン/エンタメ/教育・Tips/ビジネス/トレンド/その他のいずれか","caption":"内容から推測50字","analysis":"想定される内容","ideas":["アイデア1","アイデア2","アイデア3"],"hot":false}`;

    cm('mgsheets');toast(`✅ ${urls.length}個のURLを分析・保存しました！`);document.getElementById('sheetid').value='';document.getElementById('apikey').value='';
  }catch(e){toast('⚠️ エラーが発生しました');console.error(e);}
  btn.disabled=false;btn.innerHTML='🔄 読み込み開始';

function fn(n){if(n>=10000)return (n/10000).toFixed(1)+'万';if(n>=1000)return (n/1000).toFixed(1)+'K';return (n||0).toString();}
function card(p){
  const g=GN[p.genre]||GN['その他'];const col=ac(p.accountName);
  const mx=Math.max(...S.posts.filter(x=>x.engRate>0).map(x=>x.engRate),1);const ep=Math.min((p.engRate/mx)*100,100);
  const dt=new Date(p.date||p.createdAt).toLocaleDateString('ja-JP',{month:'numeric',day:'numeric'});
  return `<div class="pcard ${p.sns==='ig'?'igc':'xc'}" onclick="openDetail('${p.id}')">
    <div class="pthumb">
      <div class="pph"><div class="pi2">${p.sns==='ig'?'📸':'𝕏'}</div><div class="pt">${p.sns==='ig'?'Instagram':'X'}</div></div>
      <span class="tsnsbadge ${p.sns==='ig'?'big':'bx'}">${p.sns==='ig'?'IG':'X'}</span>
      ${p.hot?'<span class="hotfl">🔥 HOT</span>':''}
      ${p.deleted?'<div class="delf">削除済み</div>':''}
    </div>
    <div class="cbody">
      <div class="cacc"><div class="cav" style="background:${col}18;color:${col}">${p.accountName[0].toUpperCase()}</div><div class="can">@${p.accountName}</div><div class="cdt">${dt}</div></div>
      <div class="ccap">${p.caption}</div>
      <div class="cgenre" style="background:${g.bg};color:${g.c}">${g.e} ${p.genre}</div>
      <div class="cstats">
        <div class="cstat"><span style="font-size:12px">❤️</span><div><div class="csv">${fn(p.likes)}</div><div class="csl">いいね</div></div></div>
        <div class="cstat"><span style="font-size:12px">💬</span><div><div class="csv">${fn(p.comments)}</div><div class="csl">コメント</div></div></div>
      </div>
      ${p.engRate>0?`<div class="engrow"><div class="engl">ENG率</div><div class="engbw"><div class="engbf" style="width:${ep}%;background:${p.sns==='ig'?'var(--ig)':'var(--xp)'}"></div></div><div class="engv">${p.engRate}%</div></div>`:''}
    </div>
  </div>`;
}
function fsns(v,el){S.fSNS=v;document.querySelectorAll('.fbar .fc').forEach(c=>c.classList.remove('act'));el.classList.add('act');renderFeed();}
function fsort(v){S.fSort=v;renderFeed();}
function renderFeed(){
  let ps=[...S.posts];
  if(S.fSNS!=='all')ps=ps.filter(p=>p.sns===S.fSNS);
  if(S.fSort==='likes')ps.sort((a,b)=>b.likes-a.likes);
  else if(S.fSort==='eng')ps.sort((a,b)=>b.engRate-a.engRate);
  else ps.sort((a,b)=>new Date(b.createdAt)-new Date(a.createdAt));
  const el=document.getElementById('fposts');
  el.innerHTML=ps.length?`<div class="pgrid">${ps.map(card).join('')}</div>`:'<div style="text-align:center;padding:40px;color:var(--g400)"><div style="font-size:32px;opacity:.4;margin-bottom:10px">🔍</div><div style="font-size:16px">投稿がありません</div></div>';
}
function openDetail(id){const p=S.posts.find(x=>x.id===id);if(!p)return;alert(`@${p.accountName}\n${p.genre}\nいいね: ${p.likes}\nENG率: ${p.engRate}%`);}
document.getElementById('pdate').value=new Date().toISOString().split('T')[0];pSNS('ig');
